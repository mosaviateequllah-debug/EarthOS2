server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  location /api/ { proxy_pass http://api:8000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_connect_timeout 10s; proxy_read_timeout 60s; }
  location /health { proxy_pass http://api:8000/health; }
  location /docs { proxy_pass http://api:8000/docs; }
  location /openapi.json { proxy_pass http://api:8000/openapi.json; }
  location / { try_files $uri $uri/ /index.html;  }
}
